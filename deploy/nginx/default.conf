# Nginx：托管前端 SPA + 反向代理后端（含 SSE 长连接）
server {
    listen 80;
    server_name _;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SSE 长连接接口：关闭缓冲、HTTP/1.1、拉长读超时
    location ~ ^/(chat|stream)$ {
        proxy_pass http://backend:9093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 必需
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";          # 清空，支持长连接
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;                # 长于 broker 心跳(15s)与长任务时长
        proxy_send_timeout 3600s;
    }

    # 其余后端接口：auth / sessions / health / internal
    location ~ ^/(auth|sessions|health|internal)(/|$) {
        proxy_pass http://backend:9093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
