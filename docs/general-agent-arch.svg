<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#37474F"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#78909C"/>
    </marker>
    <marker id="ads" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#78909C"/>
    </marker>
    <style>
      text { font-family:'Microsoft YaHei','PingFang SC',sans-serif; }
      .lt { font-weight:bold; font-size:13px; }
      .bt { font-weight:bold; font-size:12px; }
      .bs { font-size:10.5px; fill:#333; }
      .ns { font-size:10px; fill:#555; }
      .it { font-size:10px; fill:#666; font-style:italic; }
      .al { font-size:10.5px; fill:#37474F; }
      .ald { font-size:10px; fill:#546E7A; font-style:italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="#FAFBFC"/>
  <text x="620" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A237E">general-agent 架构</text>
  <text x="620" y="55" text-anchor="middle" class="ns">Python + FastAPI 独立服务 · LLM 走 OpenAI 兼容端点 · Skill 进程内自研插件 · 中间件可选</text>

  <rect x="244" y="70" width="380" height="44" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="434" y="90" text-anchor="middle" class="bt" fill="#B71C1C">前端 / EventSource</text>
  <text x="434" y="106" text-anchor="middle" class="ns">POST /chat · GET /stream</text>

  <rect x="30" y="130" width="970" height="110" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="44" y="152" class="lt" fill="#1565C0">接入层 M2（FastAPI）</text>
  <rect x="46" y="162" width="226" height="68" rx="5" fill="#fff" stroke="#1976D2"/>
  <text x="159" y="184" text-anchor="middle" class="bt">HTTP/SSE 网关</text>
  <text x="159" y="202" text-anchor="middle" class="bs">POST /chat 建轮</text>
  <text x="159" y="220" text-anchor="middle" class="bs">GET /stream 持久</text>
  <rect x="284" y="162" width="226" height="68" rx="5" fill="#fff" stroke="#1976D2"/>
  <text x="397" y="184" text-anchor="middle" class="bt">SSE Translator</text>
  <text x="397" y="202" text-anchor="middle" class="bs">协议翻译</text>
  <text x="397" y="220" text-anchor="middle" class="bs">SDK事件 -> UI事件</text>
  <rect x="522" y="162" width="226" height="68" rx="5" fill="#fff" stroke="#1976D2"/>
  <text x="635" y="184" text-anchor="middle" class="bt">心跳保活</text>
  <text x="635" y="202" text-anchor="middle" class="bs">:heartbeat 注释行</text>
  <text x="635" y="220" text-anchor="middle" class="bs">刷新网关 idle</text>
  <rect x="760" y="162" width="226" height="68" rx="5" fill="#fff" stroke="#1976D2"/>
  <text x="873" y="184" text-anchor="middle" class="bt">断线续传</text>
  <text x="873" y="202" text-anchor="middle" class="bs">eventSeq</text>
  <text x="873" y="220" text-anchor="middle" class="bs">Last-Event-ID</text>

  <rect x="30" y="250" width="970" height="78" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="44" y="272" class="lt" fill="#E65100">治理层 M6（横切）</text>
  <rect x="46" y="282" width="180" height="38" rx="5" fill="#fff" stroke="#F57C00"/>
  <text x="136" y="306" text-anchor="middle" class="bt">鉴权网关</text>
  <rect x="236" y="282" width="200" height="38" rx="5" fill="#fff" stroke="#F57C00"/>
  <text x="336" y="300" text-anchor="middle" class="bt">多租户隔离</text>
  <text x="336" y="314" text-anchor="middle" class="ns">service+env+user</text>
  <rect x="446" y="282" width="170" height="38" rx="5" fill="#fff" stroke="#F57C00"/>
  <text x="531" y="306" text-anchor="middle" class="bt">凭证脱敏</text>
  <rect x="626" y="282" width="170" height="38" rx="5" fill="#fff" stroke="#F57C00"/>
  <text x="711" y="306" text-anchor="middle" class="bt">工具白名单</text>
  <rect x="806" y="282" width="180" height="38" rx="5" fill="#fff" stroke="#F57C00"/>
  <text x="896" y="306" text-anchor="middle" class="bt">限流·五层流控</text>

  <rect x="30" y="340" width="970" height="250" rx="8" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="44" y="362" class="lt" fill="#2E7D32">核心层</text>

  <rect x="46" y="378" width="218" height="198" rx="6" fill="#C8E6C9" stroke="#388E3C"/>
  <text x="155" y="400" text-anchor="middle" class="bt">会话与上下文 M3</text>
  <text x="155" y="426" text-anchor="middle" class="bs">对话历史 · token 裁剪</text>
  <text x="155" y="448" text-anchor="middle" class="bs">四级 ID 分层</text>
  <text x="155" y="466" text-anchor="middle" class="ns">session / turn</text>
  <text x="155" y="482" text-anchor="middle" class="ns">event / task</text>
  <text x="155" y="508" text-anchor="middle" class="bs">Redis 持久化</text>
  <text x="155" y="526" text-anchor="middle" class="ns">跨实例共享</text>
  <text x="155" y="552" text-anchor="middle" class="bs">上下文注入 Loop</text>

  <rect x="284" y="378" width="300" height="130" rx="6" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="434" y="400" text-anchor="middle" class="bt">Agent Loop M4</text>
  <text x="434" y="426" text-anchor="middle" class="bs">plan -> act（工具调用）</text>
  <text x="434" y="446" text-anchor="middle" class="bs">-> observe -> reflect</text>
  <text x="434" y="466" text-anchor="middle" class="bs">-> 响应生成</text>
  <text x="434" y="492" text-anchor="middle" class="it">意图由 LLM + Skill 描述吸收</text>

  <rect x="284" y="518" width="300" height="58" rx="6" fill="#B2DFDB" stroke="#00838F"/>
  <text x="434" y="538" text-anchor="middle" class="bt">LLM 调用 M4</text>
  <text x="434" y="556" text-anchor="middle" class="ns">HTTP -> OpenAI 兼容端点</text>
  <text x="434" y="570" text-anchor="middle" class="ns">chat/completions · tools · SSE</text>

  <rect x="604" y="378" width="382" height="198" rx="6" fill="#C8E6C9" stroke="#388E3C"/>
  <text x="795" y="400" text-anchor="middle" class="bt">长任务稳定性 M7</text>
  <text x="795" y="428" text-anchor="middle" class="bs">Producer Queue 解耦</text>
  <text x="795" y="448" text-anchor="middle" class="ns">SDK ↔ SSE 生命周期解绑</text>
  <text x="795" y="472" text-anchor="middle" class="bs">背压：阻塞不丢</text>
  <text x="795" y="496" text-anchor="middle" class="bs">taskId 状态机</text>
  <text x="795" y="514" text-anchor="middle" class="ns">PENDING / RUNNING /</text>
  <text x="795" y="530" text-anchor="middle" class="ns">SUCCESS / FAIL</text>
  <text x="795" y="556" text-anchor="middle" class="bs">异步完成通知</text>
  <text x="795" y="572" text-anchor="middle" class="ns">MQ -> SSE notification</text>

  <rect x="30" y="600" width="970" height="120" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="44" y="622" class="lt" fill="#6A1B9A">扩展层 M5 · Skill 插件化（MCP）</text>
  <rect x="60" y="632" width="190" height="34" rx="5" fill="#fff" stroke="#7B1FA2"/>
  <text x="155" y="654" text-anchor="middle" class="bt">Skill 注册/发现</text>
  <rect x="260" y="632" width="140" height="34" rx="5" fill="#fff" stroke="#7B1FA2"/>
  <text x="330" y="654" text-anchor="middle" class="bt">动态加载</text>
  <rect x="410" y="632" width="140" height="34" rx="5" fill="#fff" stroke="#7B1FA2"/>
  <text x="480" y="654" text-anchor="middle" class="bt">权限校验</text>
  <rect x="560" y="632" width="190" height="34" rx="5" fill="#fff" stroke="#7B1FA2"/>
  <text x="655" y="654" text-anchor="middle" class="bt">services 注入</text>
  <rect x="760" y="632" width="180" height="34" rx="5" fill="#fff" stroke="#7B1FA2"/>
  <text x="850" y="654" text-anchor="middle" class="bt">白名单按 env</text>
  <rect x="60" y="676" width="190" height="36" rx="5" fill="#FCE4EC" stroke="#7B1FA2"/>
  <text x="155" y="699" text-anchor="middle" class="bs">业务 Skill A</text>
  <rect x="260" y="676" width="190" height="36" rx="5" fill="#FCE4EC" stroke="#7B1FA2"/>
  <text x="355" y="699" text-anchor="middle" class="bs">业务 Skill B</text>
  <rect x="460" y="676" width="180" height="36" rx="5" fill="#FCE4EC" stroke="#7B1FA2"/>
  <text x="550" y="699" text-anchor="middle" class="bs">业务 Skill C</text>
  <rect x="650" y="676" width="140" height="36" rx="5" fill="#FCE4EC" stroke="#7B1FA2"/>
  <text x="720" y="699" text-anchor="middle" class="bs">业务 Skill D</text>
  <rect x="800" y="676" width="140" height="36" rx="5" fill="#FCE4EC" stroke="#7B1FA2"/>
  <text x="870" y="699" text-anchor="middle" class="ns">业务 Skill ...（按需注册）</text>

  <rect x="30" y="730" width="970" height="200" rx="8" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <text x="44" y="752" class="lt" fill="#37474F">外部依赖</text>
  <rect x="46" y="762" width="290" height="158" rx="6" fill="#fff" stroke="#90A4AE"/>
  <text x="191" y="788" text-anchor="middle" class="bt">OpenAI 兼容 LLM 端点</text>
  <text x="191" y="812" text-anchor="middle" class="ns">/v1/chat/completions（HTTP）</text>
  <text x="191" y="830" text-anchor="middle" class="ns">tools / 流式 tool_calls</text>
  <text x="191" y="854" text-anchor="middle" class="ns">多 provider 中立</text>
  <text x="191" y="880" text-anchor="middle" class="it">ARK / Ollama / DeepSeek / 内部网关等</text>
  <text x="191" y="902" text-anchor="middle" class="it">agent 经 OpenAICompatibleModel 调用</text>
  <rect x="346" y="762" width="290" height="158" rx="6" fill="#fff" stroke="#90A4AE"/>
  <text x="491" y="788" text-anchor="middle" class="bt">业务系统（Skill 后端）</text>
  <text x="491" y="812" text-anchor="middle" class="ns">业务服务 A</text>
  <text x="491" y="830" text-anchor="middle" class="it">业务 REST / RPC API</text>
  <text x="491" y="854" text-anchor="middle" class="ns">业务服务 B</text>
  <text x="491" y="872" text-anchor="middle" class="it">异步任务处理</text>
  <text x="491" y="898" text-anchor="middle" class="ns">完成后回调 /internal/notify</text>
  <rect x="646" y="762" width="340" height="158" rx="6" fill="#fff" stroke="#90A4AE"/>
  <text x="816" y="788" text-anchor="middle" class="bt">基础设施（可选）</text>
  <text x="816" y="812" text-anchor="middle" class="ns">Redis：多实例 Broker / 会话元数据</text>
  <text x="816" y="836" text-anchor="middle" class="ns">MySQL：消息历史 agent_message</text>
  <text x="816" y="860" text-anchor="middle" class="ns">通知：webhook /internal/notify</text>
  <text x="816" y="898" text-anchor="middle" class="it">未配置时 Broker 用内存、历史可 FakeStore</text>

  <rect x="1020" y="130" width="200" height="800" rx="8" fill="#F5F5F5" stroke="#616161" stroke-width="1.5"/>
  <text x="1120" y="154" text-anchor="middle" class="lt" fill="#424242">可观测性 M8</text>
  <rect x="1036" y="170" width="168" height="56" rx="5" fill="#fff" stroke="#9E9E9E"/>
  <text x="1120" y="192" text-anchor="middle" class="bt">全链路 Trace</text>
  <text x="1120" y="210" text-anchor="middle" class="ns">traceId 贯穿</text>
  <rect x="1036" y="236" width="168" height="56" rx="5" fill="#fff" stroke="#9E9E9E"/>
  <text x="1120" y="258" text-anchor="middle" class="bt">Span 耗时统计</text>
  <text x="1120" y="276" text-anchor="middle" class="ns">定位慢阶段</text>
  <rect x="1036" y="302" width="168" height="56" rx="5" fill="#fff" stroke="#9E9E9E"/>
  <text x="1120" y="324" text-anchor="middle" class="bt">结构化日志</text>
  <text x="1120" y="342" text-anchor="middle" class="ns">输入输出可回放</text>
  <rect x="1036" y="368" width="168" height="78" rx="5" fill="#fff" stroke="#9E9E9E"/>
  <text x="1120" y="390" text-anchor="middle" class="bt">Skill Metric</text>
  <text x="1120" y="408" text-anchor="middle" class="ns">次数 / 成功率</text>
  <text x="1120" y="426" text-anchor="middle" class="ns">P95 耗时</text>
  <text x="1120" y="444" text-anchor="middle" class="ns">看板 + 告警</text>
  <rect x="1036" y="456" width="168" height="66" rx="5" fill="#fff" stroke="#9E9E9E"/>
  <text x="1120" y="478" text-anchor="middle" class="bt">错误分类告警</text>
  <text x="1120" y="496" text-anchor="middle" class="ns">按类型分级</text>
  <text x="1120" y="514" text-anchor="middle" class="ns">快速定位</text>
  <rect x="1036" y="534" width="168" height="384" rx="5" fill="#fff" stroke="#9E9E9E"/>
  <text x="1120" y="558" text-anchor="middle" class="bt">贯穿全链路</text>
  <text x="1120" y="586" text-anchor="middle" class="ns">排查路径：</text>
  <text x="1120" y="610" text-anchor="middle" class="ns">① Metric 看板</text>
  <text x="1120" y="628" text-anchor="middle" class="ns">  定位慢阶段</text>
  <text x="1120" y="656" text-anchor="middle" class="ns">② Trace 日志</text>
  <text x="1120" y="674" text-anchor="middle" class="ns">  回放调用链</text>
  <text x="1120" y="702" text-anchor="middle" class="ns">③ 定位根因</text>
  <text x="1120" y="720" text-anchor="middle" class="ns">  模型慢？</text>
  <text x="1120" y="738" text-anchor="middle" class="ns">  工具慢？</text>
  <text x="1120" y="756" text-anchor="middle" class="ns">  自身逻辑？</text>
  <text x="1120" y="796" text-anchor="middle" class="it">M8 从 M2 起</text>
  <text x="1120" y="814" text-anchor="middle" class="it">即埋 traceId</text>

  <line x1="434" y1="114" x2="434" y2="129" stroke="#37474F" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="442" y="126" class="al">请求/响应</text>
  <line x1="434" y1="240" x2="434" y2="251" stroke="#37474F" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="442" y="248" class="al">鉴权</text>
  <line x1="434" y1="328" x2="434" y2="377" stroke="#37474F" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="442" y="356" class="al">已鉴权请求</text>
  <line x1="434" y1="508" x2="434" y2="517" stroke="#37474F" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arrs)"/>
  <text x="442" y="515" class="al">推理/流</text>

  <line x1="584" y1="455" x2="618" y2="631" stroke="#78909C" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <text x="586" y="560" class="ald">工具调用(Skill)</text>
  <line x1="300" y1="548" x2="195" y2="761" stroke="#78909C" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <text x="120" y="650" class="ald">LLM(HTTP)</text>
  <line x1="816" y1="576" x2="816" y2="761" stroke="#78909C" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ad)" marker-start="url(#ads)"/>
  <text x="824" y="660" class="ald">状态/通知</text>
  <line x1="491" y1="712" x2="491" y2="761" stroke="#78909C" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ad)"/>
  <text x="498" y="740" class="ald">调业务 Skill</text>

  <text x="44" y="962" class="ns">M1 骨架（Python/FastAPI 独立服务） · M8 可观测性贯穿 · 业务能力以 Skill 接入</text>
  <text x="44" y="982" class="ns">Skill 为进程内自研插件（非 MCP） · LLM 走 OpenAI 兼容端点 · 业务客户端经 services 注入</text>
  <text x="1020" y="982" class="ns">实线=主请求流 · 虚线=跨层/外部调用</text>
